# Typecheck, content audit, unit/server tests and both production builds on
# every push and pull request. Browser (Playwright) journeys stay local:
# they take about 30 minutes and need a GPU for representative results.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:audit
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-production.mjs
      - run: npm run build:pages
